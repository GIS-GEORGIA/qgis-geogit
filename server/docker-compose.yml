# Forgejo git server with Git LFS and file locks for GeoGit.
#
#   cd server && docker compose up -d
#   ./setup_users.sh          # admin + test users, tokens in .env.local
#
# Data (repositories, LFS objects, database) lives in ./data.
# Port 3000 is bound to this computer only; for production put a reverse
# proxy with HTTPS in front and change ROOT_URL.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: geogit-forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__server__ROOT_URL=http://localhost:3000/
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__LFS_START_SERVER=true
      - FORGEJO__server__DISABLE_SSH=true
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=true
      - FORGEJO__repository__DEFAULT_PRIVATE=private
      # GIS data: allow large pushes and LFS files
      - FORGEJO__server__LFS_MAX_FILE_SIZE=0
      - FORGEJO__repository.upload__FILE_MAX_SIZE=2048
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"
